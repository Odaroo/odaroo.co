<!-- ⭐⭐ 2026-10-12 — THE ARCADE IS THE ONE THING THAT INSTALLS (Odaroo: "completely remove the fact that you
     could install this game directly on your phone… only ask… at the beginning of play.odaroo.co… download
     the arcade as a whole"). This REVERSES the 10-06 note below about the manifest and the install card:
     the arcade has a manifest (scope = the whole site, so every game opens inside the installed app) and
     asks to be installed a moment after it opens, every visit, lifting away after 14s. The GAMES no longer
     carry a manifest or an install card of their own; they still go full screen on the first tap.
     Still no fullscreen for the arcade page itself.
     (Original, 10-06:) THE ARCADE IS A LANDING PAGE, NOT AN APP: no install card, no manifest, no
     fullscreen. Only the GAMES install and go full screen.
     ⭐ 2026-10-12 — BUT IT DOES OPEN OFFLINE ONCE A GAME HAS BEEN PLAYED (Odaroo: "available offline…
     downloaded when the user plays one game… don't let the user download useless things if he just
     joins"). sw.js beside this page is registered only after a game is launched (play(), below, sets
     odaroo.arcade.played); a visitor who only looks around gets nothing extra. Nothing on screen says so.
     ⚠ An earlier build's worker only trusted a page naming app-shell.js; naming that file in this comment
     still lets such a phone accept this page once, and the new sw.js then replaces that worker. -->
<script>
  var ODA_PLAYED = 'odaroo.arcade.played';
  /* ⭐ 2026-11-26 — THIS SAME FILE IS ALSO odaroo.co's FRONT PAGE (GitHub Pages, repo Odaroo/odaroo.co; copied there by
     tools/sync-front.cjs). On that host there is no worker to register and no games.json beside it: the page asks
     play.odaroo.co for the list and sends every game there. */
  var ODA_BARE = /^(www\.)?odaroo\.co$/i.test(location.hostname);
  function odaKeep() { if (ODA_BARE) return Promise.resolve(); try { return navigator.serviceWorker.register('sw.js'); } catch (e) { return Promise.resolve(); } }
  /* launched from the home screen: it IS the downloaded arcade, so it keeps itself like a played one */
  var ODA_APP = false; try { ODA_APP = matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true; } catch (e) {}
  if ('serviceWorker' in navigator && !/[?&]dev\b/.test(location.search)) {
    var odaP = false; try { odaP = localStorage.getItem(ODA_PLAYED) === '1'; } catch (e) {}
    if (odaP || ODA_APP) addEventListener('load', function () { odaKeep().catch(function () {}); });
  }
  /* the installed arcade takes the whole screen on a tap (a home-screen copy made before the manifest said
     "fullscreen" still shows the phone's bars until the phone refreshes it) — the games do the same */
  function odaFsOn() { return !!(document.fullscreenElement || document.webkitFullscreenElement) || matchMedia('(display-mode: fullscreen)').matches; }
  function odaGoFull() {
    if (!ODA_APP || odaFsOn()) return;
    var d = document.documentElement, rq = d.requestFullscreen || d.webkitRequestFullscreen;
    if (rq) { try { var p = rq.call(d, { navigationUI: 'hide' }); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
  }
  /* ⭐ 2026-10-17 — BACK FROM A GAME STARTS OVER (Odaroo: "go back to it, it starts again from the beginning").
     A browser may hand the page back from its back/forward memory, frozen mid-song and mid-ring; reload it. */
  addEventListener('pageshow', function (e) { if (e.persisted) location.reload(); });
  addEventListener('pointerdown', odaGoFull, true); addEventListener('pointerup', odaGoFull, true);
  /* the browser offers the install ONCE, early: catch it here, in the head, and keep it for the card */
  var odaBip = null;
  /* ⭐ 2026-10-18 — NO INSTALL CARD (Odaroo). The browser's offer is still caught and held so Chrome does not slide
     its own install bar in over the opening either; installing stays possible from the browser's menu. */
  addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); odaBip = e; });
  addEventListener('appinstalled', function () {
    odaBip = null; try { localStorage.setItem(ODA_PLAYED, '1'); } catch (e) {}
    odaKeep().catch(function () {});           /* installed = the whole arcade is kept on the phone */
  });
</script>
<style>
  /* ⭐⭐⭐ 2026-11-26 — THE PORTFOLIO: THE OUTLETS ON TOP, THE GAMES BELOW (Odaroo: "play.odaroo.co is going to be my
     professional portfolio… as an artist, showcasing the main outlets at the top. At the bottom, we have all the
     games… in order of creation, first with Inkville and Edgework at the end"). This REPLACES the 10-09 orbit: no
     ring any more. Two shelves of cartridges that stay where they are — YouTube, Twitch, Bandcamp, SoundCloud and
     the Discord LAST (the community) — then every game, oldest first. One cartridge is lit at a time; its name, a
     line about it and the button sit underneath. Tap a cartridge to light it, tap it again (or the button) to go.
     Still plain black behind, still no invented artwork (the cartridges are the games' own icons and the brands'
     real logos), still one small speaker in the corner. The element keeps the id "orbit" ON PURPOSE: the arcade's
     offline worker (sw.js, and older copies of it on phones) only trusts a page that names it. */
  @font-face { font-family: 'Syncopate'; font-weight: 400; src: url('fonts/Syncopate-Regular.woff2') format('woff2'); font-display: swap; }
  @font-face { font-family: 'Syncopate'; font-weight: 700; src: url('fonts/Syncopate-Bold.woff2') format('woff2'); font-display: swap; }
  @font-face { font-family: 'VT323'; src: url('fonts/VT323-Regular.woff2') format('woff2'); font-display: swap; }
  :root {
    --ink: #f3eee6; --muted: #a49db0; --c: #ff3d3d;
    --wide: 'Syncopate', 'Helvetica Neue', Arial, sans-serif; --mono: 'VT323', 'Courier New', monospace;
    --gap: clamp(6px, 1.6vw, 16px);
    /* an upright screen: five outlets across, the games three across (two rows of three) */
    --oc: min(calc((100vw - 44px - 4 * var(--gap)) / 5), 10.1dvh, 132px);
    --gz: min(calc((100vw - 44px - 2 * var(--gap)) / 3), 10.1dvh, 132px);
    --deck: clamp(46px, 12.5dvh, 112px);
    --gcols: 3;
    color-scheme: dark;
  }
  /* a sideways or desktop screen: the games stand in ONE row, in order */
  @media (min-aspect-ratio: 1/1) {
    :root { --oc: min(calc((100vw - 44px - 5 * var(--gap)) / 6), 13dvh, 124px); --gz: var(--oc); --gcols: 6; }
  }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #000; color: var(--ink); }
  body { height: 100dvh; display: flex; flex-direction: column; -webkit-tap-highlight-color: transparent; font-family: var(--wide);
         touch-action: none; user-select: none; -webkit-user-select: none; }

  /* the wall: the name, then the two shelves. It leans a few pixels with the phone's tilt (or the mouse). */
  #orbit { position: relative; z-index: 2; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; align-items: center;
           justify-content: center; gap: clamp(6px, 1.2dvh, 22px); will-change: transform;
           padding: max(14px, calc(env(safe-area-inset-top) + 8px)) 22px 0; }
  /* ⭐ 2026-11-26 (later) — THE MARK, NOT THE WORD (Odaroo: "completely remove the Odaroo. Just put Odaroo & Co., the
     logo, on top"). The nine tiles O D A / R O O / & C O. as the boot leaves them (the O diagonal lit), small and still. */
  #mast { text-align: center; line-height: 1; margin-bottom: clamp(4px, 1dvh, 18px); }
  #mark { --mt: clamp(27px, 5.75dvh, 52px); display: inline-grid; grid-template-columns: repeat(3, var(--mt)); grid-auto-rows: var(--mt);
          gap: calc(var(--mt) * .14); font-family: 'ODPixel', 'Courier New', monospace; }
  #mark b { position: relative; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #0d1018;
            border: max(1px, calc(var(--mt) * .08)) solid #eef2f8; color: #eef2f8; font-weight: 400; font-size: calc(var(--mt) * .48); line-height: 1; }
  #mark b.o { background: #eef2f8; color: #0d1018; }
  #mark b u { position: absolute; left: 62%; bottom: 14%; text-decoration: none; font-size: .7em; }
  .shelf { display: flex; flex-direction: column; align-items: center; gap: clamp(5px, 1.2dvh, 12px); }
  .shelf h2 { margin: 0; display: flex; align-items: center; gap: 12px; font: 400 clamp(15px, 2.7vmin, 19px)/1 var(--mono);
              letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
  .row { display: grid; gap: var(--gap); justify-content: center; }
  #rowOut { --cart: var(--oc); grid-template-columns: repeat(5, var(--cart)); }
  #rowGames { --cart: var(--gz); grid-template-columns: repeat(var(--gcols), var(--cart)); }

  /* a cartridge. The lit one (.sel) is full strength, a size up, glowing in its own colour; the rest stand back. */
  .cart { position: relative; width: var(--cart); height: var(--cart); cursor: pointer; opacity: .62;
          transition: opacity .25s ease, scale .28s cubic-bezier(.2, 1.5, .4, 1); }
  .cart.sel { opacity: 1; scale: 1.34; z-index: 2; }   /* 2026-11-26 (night): "when you hover over a cartridge, it should be zoomed in already" (was 1.14) */
  /* it FLOATS a little: independent translate/rotate, so it composes with the lit one's scale */
  .bob { width: 100%; height: 100%; animation: bob 4.2s ease-in-out infinite; }
  .cart:nth-child(3n) .bob { animation-duration: 5.4s; animation-delay: -3.2s; }
  .cart:nth-child(3n+2) .bob { animation-duration: 4.9s; animation-delay: -1.7s; }
  .cart:nth-child(4n+1) .bob { animation-duration: 4.6s; animation-delay: -2.4s; }
  @keyframes bob { 0%, 100% { translate: 0 -2.5%; rotate: -1.6deg; } 50% { translate: 0 2.5%; rotate: 1.6deg; } }
  .cart img { display: block; width: 100%; height: 100%; image-rendering: pixelated; -webkit-user-drag: none; pointer-events: none;
              filter: drop-shadow(0 0 calc(var(--cart) * .05) color-mix(in srgb, var(--gc, #fff) 50%, transparent)); }
  .cart.sel img { filter: drop-shadow(0 0 calc(var(--cart) * .1) var(--gc, #fff)); }
  .cart img.blend { mix-blend-mode: screen; filter: none; }
  /* AFTER THE BOOT THE CARTRIDGES LAND ONE BY ONE (2026-10-13, a Mario All-Stars select screen), now in reading
     order: the outlets left to right, then the games oldest first. body.ringwait hides everything under the boot;
     body.ringin drops each cartridge in on its own beat (--k), then the card arrives. The img is what animates
     (scale/opacity) — .cart's own scale is the lit one's and .bob's translate/rotate the float. */
  body.ringwait .cart img, body.ringwait #info, body.ringwait #mast, body.ringwait .shelf h2, body.ringwait #deck { opacity: 0; }
  body.ringin .cart img { animation: cartIn .46s cubic-bezier(.2, 1.5, .4, 1) both; animation-delay: calc(var(--k, 0) * 170ms); }
  body.ringin #mast, body.ringin .shelf h2 { animation: infoIn .5s ease both; }
  body.ringin #info, body.ringin #deck { animation: infoIn .5s ease both; animation-delay: calc(var(--kn, 6) * 170ms + 250ms); }
  @keyframes cartIn { 0% { opacity: 0; scale: .2; } 60% { opacity: 1; scale: 1.12; } 100% { opacity: 1; scale: 1; } }
  @keyframes infoIn { from { opacity: 0; translate: 0 12px; } to { opacity: 1; translate: 0 0; } }

  /* the lit cartridge's card: what it is (one word), its name, and TWO LINES — always two, each on its own row
     (Odaroo, 2026-11-26: "Visuals and captures." then a break, then "Worlds in motion."). ⚠ There is NO BUTTON
     any more: a cartridge is opened by carrying it down into the handheld below (see #deck). */
  #info { position: relative; z-index: 3; flex: 0 0 auto; text-align: center; padding: clamp(4px, 1.4dvh, 16px) 16px clamp(4px, 1.2dvh, 14px); }
  .more { animation: moreIn .3s ease both; }
  @keyframes moreIn { from { opacity: 0; translate: 0 8px; } to { opacity: 1; translate: 0 0; } }
  .kind { margin: 0 0 .45em; font-family: var(--mono); font-size: clamp(15px, 2.7vmin, 19px); line-height: 1; letter-spacing: .3em;
          margin-right: -.3em; color: var(--c); text-transform: uppercase; }
  h1 { margin: 0 0 .3em; font-weight: 700; line-height: 1; letter-spacing: .08em; font-size: clamp(19px, min(6.2vw, 4.4dvh), 46px);
       text-shadow: 0 4px 30px rgba(0,0,0,.8); overflow-wrap: anywhere; }
  .tag { font-family: var(--mono); font-size: clamp(17px, min(4.5vw, 3.2vmin + 6px), 24px); line-height: 1.1; color: #e2dbea; margin: 0; text-shadow: 0 2px 12px #000; }
  .tag span { display: block; white-space: nowrap; }
  .tag .rt { display: inline-block; margin-left: 8px; padding: 0 5px; border: 1px solid var(--c); color: var(--c); font-size: .85em; line-height: 1.2; }

  /* ⭐⭐⭐ 2026-11-26 (later) — THE HANDHELD: THE BACK OF A GAME BOY, AND THE CARTRIDGE GOES IN IT (Odaroo: "remove the
     button… the back of a Game Boy in the same silhouette design, the neon white contour… press and hold the cartridge
     to swipe it down. Only when it swipes down does the screen start glitching… as if everything's connecting… then
     redirect… Don't have anything that says drag and drop. Make it intuitive"). Only its top edge and cartridge bay
     show, rising from the foot of the screen. NO WORDS, no arrow: the bay breathes, and brightens while a cartridge
     is being carried. Drawn with square corners on purpose (the cartridges are pixel shells). */
  #deck { position: relative; z-index: 3; flex: 0 0 auto; height: var(--deck); display: flex; justify-content: center; margin-top: calc(var(--deck) * .46 + clamp(26px, 4dvh, 40px));
          padding-bottom: env(safe-area-inset-bottom); }
  #deck svg { display: block; height: 100%; width: auto; aspect-ratio: 60 / 46; overflow: hidden; fill: none; stroke: #f4f8ff; stroke-width: 3;
              stroke-linejoin: miter; shape-rendering: crispEdges; filter: drop-shadow(0 0 5px #bfe6ffaa); opacity: .8; transition: opacity .25s; }
  #deck .bay { stroke: var(--c); stroke-width: 2.6; animation: bay 2.6s ease-in-out infinite; }
  #deck .lip { fill: #f4f8ff; stroke: none; }
  @keyframes bay { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  body.carry #deck svg { opacity: 1; }
  body.carry #deck .bay { animation-duration: .7s; }
  /* the cartridge in the hand: a copy that follows the finger (the one on the shelf dims until it is let go) */
  #held { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; will-change: transform; }
  /* IN THE HAND IT IS A SOLID THING (Odaroo, 2026-11-26: "the cartridge turns into 3D as you press and hold it"): the
     same picture stacked nine deep (.box b = the darker copies behind, 2px apart), tipped back and turned; it leans
     with the direction it is carried (--rx/--ry, set by moveHeld) and goes flat again as it enters the bay. */
  #held .box { position: absolute; inset: 0; transform-style: preserve-3d; transform: perspective(520px) scale(var(--lift, 1)) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
               transition: transform .24s cubic-bezier(.2, 1.4, .4, 1); }
  /* ⭐ 2026-11-26 (evening) — PICKED UP, IT COMES TOWARD YOU (Odaroo: "as you're picking up the cartridge, the cartridge
     gets closer to you, so press and hold, and then you have the drag and drop"). --lift grows the solid cartridge by
     LIFT (moveHeld sets it while it is carried) and its glow widens; it is 1 again on the way home or into the bay. */
  #held.up img.face { filter: drop-shadow(0 0 20px var(--gc, #fff)) drop-shadow(0 14px 16px #000c); }
  #held img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  #held img.side { filter: brightness(.42); }
  #held img.face { filter: drop-shadow(0 0 12px var(--gc, #fff)); }
  /* THE SIGN OVER THE BAY (Odaroo, 2026-11-26, later: "a rubber hose hand glove pointing down… on top of the glove, the
     Japanese equivalent of drag and drop here. Don't include any English wording"). This REVERSES the same day's "no
     words, no arrow": Japanese only, and the glove. It bobs on its own HTML box (translate), never inside the svg. */
  @font-face { font-family: 'ODHint'; src: url('fonts/DotGothic16-hint.woff2') format('woff2'); font-display: swap; }
  /* ⭐ 2026-11-26 (evening) — THE GLOVE IS ABOVE THE CONSOLE NOW, NOT IN IT (Odaroo: "put it above the actual console so we
     see that we have to drag and drop. Some people didn't know… too complicated for the non-gamer… on top of the console,
     pointing down and animated"). It stands over the bay with the sign over it, and PRESSES DOWN toward the bay and
     comes back, again and again (hintBob). #deck's margin-top is the room it stands in. */
  #hint { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom) + var(--deck) + 5px); width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
          pointer-events: none; transition: opacity .25s; }
  #hint span { white-space: nowrap; font-family: 'ODHint', 'DotGothic16', sans-serif; font-size: clamp(11px, 1.9dvh, 15px); letter-spacing: .12em;
               color: #f4f8ff; text-shadow: 0 0 6px #bfe6ffaa, 0 0 2px #000, 0 1px 0 #000; margin-bottom: 9px; }
  #hint img { display: block; height: calc(var(--deck) * .46); width: auto; aspect-ratio: 22 / 25; image-rendering: pixelated; filter: drop-shadow(0 0 5px #bfe6ffaa); animation: hintBob 1.5s cubic-bezier(.5, 0, .3, 1) infinite; }
  @keyframes hintBob { 0%, 100% { translate: 0 -5px; } 42%, 58% { translate: 0 calc(var(--deck) * .17); } }
  body.carry #hint img { animation-duration: .75s; }
  body.glitch #hint, body.gone #hint, body.ringwait #hint { opacity: 0; }
  #held.back, #held.seat { transition: transform .26s cubic-bezier(.3, .9, .3, 1), opacity .26s; }
  #held.sunk { transition: transform .34s cubic-bezier(.5, 0, .9, .4); }
  .cart.away { opacity: .14 !important; }
  .cart { touch-action: none; }

  /* THE LOOP BEHIND: a short, silent film of whatever is lit (its page scrolling, or the game being played), dim
     enough that the shelves stay the subject. One <video>, fetched only once a cartridge has stayed lit for a moment;
     not at all with Save-Data or reduced motion. (2026-10-28 took the old 23 MB of loops off for speed: these are
     small squares, a few hundred KB each, and only the lit one is ever asked for.) */
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; opacity: 0; transition: opacity .7s ease; pointer-events: none; }
  #bg.on { opacity: .3; }
  #flow { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  #shade { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, #0000 0%, #000a 78%, #000 100%); opacity: 0; transition: opacity .7s; }
  #bg.on + #shade { opacity: 1; }

  /* the controller picture (padlink.js draws it at the foot of the screen) would sit on the handheld: here it goes top-left */
  #padlinkHud { left: max(8px, env(safe-area-inset-left)) !important; top: max(8px, env(safe-area-inset-top)) !important; bottom: auto !important;
                translate: 0 0 !important; width: min(120px, 28vw) !important; }

  /* CONNECTING: the picture tears for a couple of seconds, collapses to a line, and the link opens. No words. */
  #glitch { position: fixed; inset: 0; z-index: 40; pointer-events: none; display: none; overflow: hidden; }
  body.glitch #glitch { display: block; }
  #glitch::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, #0000 0 2px, #ffffff14 2px 4px); }
  #glitch i { position: absolute; left: 0; right: 0; height: 9%; background: linear-gradient(#fff0, color-mix(in srgb, var(--c) 38%, #fff0), #fff0); animation: gbar 0.9s linear infinite; }
  #glitch i + i { height: 4%; animation-duration: .55s; animation-direction: reverse; background: linear-gradient(#fff0, #ffffff40, #fff0); }
  @keyframes gbar { from { translate: 0 -20vh; } to { translate: 0 120vh; } }
  #glitch b { position: absolute; inset: 0; background: #fff; opacity: 0; animation: gflash 1.2s steps(1) both; }   /* as long as GLITCH_MS */
  @keyframes gflash { 0%, 6% { opacity: .5; } 7%, 30% { opacity: 0; } 31% { opacity: .18; } 33%, 61% { opacity: 0; } 62% { opacity: .25; } 64%, 100% { opacity: 0; } }
  body.glitch #orbit, body.glitch #info, body.glitch #deck { animation: gtear .34s steps(1) infinite; }
  body.glitch #info { animation-duration: .27s; animation-delay: -.11s; }
  body.glitch #deck { animation-duration: .41s; animation-delay: -.2s; }
  @keyframes gtear {
    0% { translate: 0 0; clip-path: none; opacity: 1; }
    14% { translate: -9px 0; clip-path: inset(8% 0 58% 0); }
    28% { translate: 7px 2px; clip-path: inset(46% 0 22% 0); opacity: .8; }
    42% { translate: 0 0; clip-path: none; opacity: 1; }
    57% { translate: 12px -1px; clip-path: inset(70% 0 4% 0); }
    71% { translate: -4px 0; clip-path: inset(0 0 81% 0); opacity: .7; }
    85% { translate: 2px 0; clip-path: none; opacity: 1; }
  }
  body.gone #orbit, body.gone #info, body.gone #deck, body.gone #bg, body.gone #held { animation: gout .42s cubic-bezier(.7, 0, 1, .5) forwards; }
  @keyframes gout { 0% { scale: 1 1; opacity: 1; } 70% { scale: 1.04 .012; opacity: 1; } 100% { scale: 0 .004; opacity: 0; } }
  /* ⭐ 2026-11-26 (evening) — AN UPRIGHT PHONE: THE CARTRIDGES ARE THE BIG THING (Odaroo: "much more grandiose on the
     computer… in the handheld it looks so much smaller. I have to zoom in"; asked which, he chose bigger cartridges and
     words, paid for by a smaller mark and no "Artist · video, live…" line). Upright only: the sideways and desktop
     page keeps the big mark. The outlets are as wide as five across allows; the games get the height that was freed. */
  /* ⭐⭐ 2026-11-26 (night) — UPRIGHT, NOTHING IS CAPPED IN PIXELS ANY MORE (Odaroo, with a screenshot from his Fold: "it
     still looks small on a handheld… it could be twice the size"). His phone's browser lays the page out ~958 CSS px
     wide at 1x (a foldable is given the desktop-style viewport), so every "132px / 30px / 26px at most" cap turned the
     page into a small island. Upright, every size below is a share of the screen (vw / dvh) with only a floor, so a
     345-wide phone and a 958-wide one show the SAME picture. ⚠ Do not add a px maximum back in this block.
     Also here: THE WORDS, THEN AIR, THEN THE SIGN + GLOVE + CONSOLE ("the description and the console at the bottom,
     spaced out, so we see the hand is pointing down"): #deck's margin-top is the sign's room PLUS a clear gap (--air). */
  @media (max-aspect-ratio: 999/1000) {
    :root { --gap: max(6px, 1.6vw); --air: 3.4dvh;
            --oc: min(calc((100vw - 24px - 4 * var(--gap)) / 5), 10.6dvh);

<script>
/* ── THE BOOT (Odaroo, 2026-10-13: "when play.odaroo.co is installed, make sure that it doesn't start
   right away. The screen stays blank, and you have the regular intro… the one where you hear a chime
   with the Odaroo & Co. intro… the same intro for the website"). The Odaroo & Co. cartridge, beat for

   ⚠ 2026-10-17: the cartridge, the handheld and TAP TO LOAD are GONE from this page (see below) — only

   a glitching cartridge turns over a handheld, TAP TO LOAD; the tap plays the "mystery solved" chime and
   starts the arcade's song; the cartridge drops in, the handheld spins, the camera dives in; O D A /
   R O O / & C O. land with the coin, the O-O-O diagonal turns green with the connect chime, and the
   sheet dissolves onto the ring. The mark inside the cartridge is the arcade's own (its app icon's
   play arrow). Mash-proof: only the first tap counts and nothing skips it.
   It plays ONCE PER VISIT: coming back from a game in the same tab or app (sessionStorage) goes straight

  IN.then = function (f) { if (IN.done) f(); else IN.wait.push(f); };
  var el = document.getElementById('intro');
  if (skip) { if (el) el.parentNode.removeChild(el); return; }

  var TILES = ['O', 'D', 'A', 'R', 'O', 'O', '&amp;', 'C', 'O<i>.</i>'];

    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  }
  function tone(f, t0, dur, type, vol) { if (ac && ac.state === 'running') voice(ac, ac.currentTime, f, t0, dur, type, vol); }
  var NOTES = {
    connect: [[1318.5, 0, 0.16, 'triangle', 0.16], [1975.5, 0.075, 0.9, 'triangle', 0.15], [3951, 0.075, 0.6, 'sine', 0.05], [2637, 0.16, 0.7, 'sine', 0.05]],
    coin: [[987.77, 0, 0.09, 'square', 0.12], [1318.5, 0.08, 0.5, 'square', 0.11], [2637, 0.08, 0.34, 'sine', 0.04]]
  };
  var WAV = {};
  function wavURL(buf) {
    var d = buf.getChannelData(0), n = d.length, b = new DataView(new ArrayBuffer(44 + n * 2)), i;
    function str(o, s) { for (var k = 0; k < s.length; k++) b.setUint8(o + k, s.charCodeAt(k)); }
    str(0, 'RIFF'); b.setUint32(4, 36 + n * 2, true); str(8, 'WAVEfmt '); b.setUint32(16, 16, true); b.setUint16(20, 1, true);
    b.setUint16(22, 1, true); b.setUint32(24, buf.sampleRate, true); b.setUint32(28, buf.sampleRate * 2, true);
    b.setUint16(32, 2, true); b.setUint16(34, 16, true); str(36, 'data'); b.setUint32(40, n * 2, true);
    for (i = 0; i < n; i++) b.setInt16(44 + i * 2, Math.max(-1, Math.min(1, d[i])) * 32767, true);

    var OC = window.OfflineAudioContext;

      NOTES[k].forEach(function (v) { voice(oc, 0, v[0], v[1], v[2], v[3], v[4]); });
      var r = oc.startRendering(); if (r && r.then) r.then(function (buf) { WAV[k] = new Audio(wavURL(buf)); WAV[k].preload = 'auto'; }, function () {});
    });
  } catch (e) {}
  function chime(k) {
    wake();
    if (ac && ac.state === 'running') { NOTES[k].forEach(function (v) { tone(v[0], v[1], v[2], v[3], v[4]); }); return; }
    var a = WAV[k];
    if (a) { try { a.currentTime = 0; var p = a.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
  }
  function sndConnect() { chime('connect'); }
  function sndCoin() { chime('coin'); }
  IN.sounds = { mystery: 0, coin: 0, connect: 0, tick: 0 };
  IN.chime = function (k) { try { chime(k); } catch (e) {} };   /* the page rings the same coin / connect chimes when a cartridge goes in */
  IN.tick = function (k) { IN.sounds.tick++; tone(659.25 * Math.pow(2, k / 12), 0, 0.07, 'square', 0.07); tone(1318.5 * Math.pow(2, k / 12), 0.03, 0.12, 'sine', 0.03); };   /* counted, so a harness can hear the chime */
  /* ⭐ 2026-10-17 — NO CARTRIDGE, NO TAP TO LOAD (Odaroo: "remove the cartridge animation insert or tap to
     load, and just have the Odaroo… two cartridges are confusing" — the cartridges come later, on the ring).
     A moment of black, then the nine tiles O D A / R O O / & C O. land with the coin, the O-O-O diagonal
     turns green, and ON THE CONNECT CHIME the song starts (it has been loading since the page opened —
     the main script calls bgm.load() first thing, so a slow browser has the whole animation to fetch it).

  function at(ms, f) { timers.push(setTimeout(f, ms)); }
  function $(id) { return document.getElementById(id); }
  function wake() { if (ac && ac.state !== 'running') { try { ac.resume(); } catch (e) {} } }

  function finish() {
    if (state === 'done') return; state = 'done';

    el.classList.add('fadeout');
    IN.on = false; IN.done = true;
    var w = IN.wait; IN.wait = []; w.forEach(function (f) { try { f(); } catch (e) {} });
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1000);
  }
  function studio() {
    var card = document.createElement('div'); card.id = 'introCard';
    card.innerHTML = '<div id="introLogo">' + TILES.map(function (c, i) { return '<div class="odc-tile" style="--i:' + i + '"><span>' + c + '</span></div>'; }).join('') + '</div>';
    el.appendChild(card);
    var logo = $('introLogo'), tiles = function () { return logo.querySelectorAll('.odc-tile'); };
    wake();
    at(300, function () { logo.classList.add('show'); IN.sounds.coin++; sndCoin(); });
    [0, 4, 8].forEach(function (n, k) { at(900 + k * 220, function () { var t = tiles()[n]; if (t) t.classList.add('spin'); }); });
    at(1720, function () {                          /* the third O is green: connected — and the song begins */
      IN.sounds.connect++; sndConnect();
      if (window.odaMusicOn) window.odaMusicOn();   /* one more ask for the song, in case the page's first was refused */
    });
    at(1740, function () { var t = tiles(); [0, 4, 8].forEach(function (n) { if (t[n]) t[n].classList.add('inv'); }); });
    at(3400, finish);
  }
  /* ⭐ 2026-10-18 — THREE SECONDS OF BLACK FIRST (Odaroo: "the website starts all black for 3 seconds, and then you see
     the odaroo.co loading… the song's already started"). The song is asked for the moment the page opens (main
     script) and plays under the black; the squares land at 3s. */
  /* ⭐ 2026-11-26 (night) — ONE SECOND NOW (Odaroo: "I liked it at first, but now that I'm reloading and testing… make sure
     that it's 1 second instead"). Only this number changed; the squares, chimes and the song under the black are the same. */
  IN.blackMs = 1000;

  addEventListener('pointerdown', wake, true); addEventListener('pointerup', wake, true);
  document.addEventListener('playing', wake, true);              /* the song is allowed to play, so the chip is too (media events reach a capture listener) */
  addEventListener('keydown', function onKey(e) {
    if (!IN.on) { removeEventListener('keydown', onKey, true); return; }
    e.preventDefault(); e.stopPropagation(); wake();
  }, true);
})();

  try { if (bgm.networkState === 0 || (bgm.networkState === 1 && bgm.readyState === 0)) bgm.load(); } catch (e) {}   /* empty, or idle with nothing fetched (preload ignored) — never while it is already loading */
  try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) {}
  function sndUI() { $('snd').classList.toggle('off', muted); $('snd').setAttribute('aria-label', muted ? 'Music on' : 'Music off'); }
  function fadeTo(v, then) {
    clearInterval(fadeIv);
    fadeIv = setInterval(function () {
      var d = v - bgm.volume, st = 0.04;
      if (Math.abs(d) <= st) { bgm.volume = v; clearInterval(fadeIv); if (then) then(); } else bgm.volume = Math.max(0, Math.min(1, bgm.volume + (d > 0 ? st : -st)));
    }, 60);
  }
  var BGM_VOL = 0.5;
  function musicOn() {
    if (muted || document.hidden || !bgm.paused) return;
    bgm.volume = 0; var p = bgm.play();
    if (p && p.then) p.then(function () { fadeTo(BGM_VOL); }).catch(function () {});
  }
  function musicOff() { fadeTo(0, function () { bgm.pause(); }); }
  /* ⭐ 2026-10-13 — while the boot sheet waits for its tap there is no song: the tap on the cartridge
     starts it (odaMusicOn, called by the boot), exactly like the games' title songs */
  window.odaMusicOn = musicOn;
  sndUI(); musicOn();                                    /* with the squares, from the top */
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function (ev) { addEventListener(ev, function first() { musicOn(); }, { passive: true, capture: true }); });
  $('snd').addEventListener('pointerdown', function (e) { e.stopPropagation(); }, true);
  $('snd').addEventListener('click', function (e) {
    e.stopPropagation(); muted = !muted; sndUI();
    try { localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch (x) {}
    if (muted) musicOff(); else musicOn();
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden) { if (!bgm.paused) bgm.pause(); } else musicOn(); });
  addEventListener('pagehide', function () { bgm.pause(); });

  /* ── THE LEAN: eases the wall toward the tilt, and rests once it is there (nothing runs while the page is still) ── */
  var last = performance.now(), running = false;
  function kick() { if (!running) { running = true; last = performance.now(); requestAnimationFrame(tick); } }
  function tick(t) {
    var dt = Math.min(0.05, (t - last) / 1000); last = t;
    tilt.x += (tilt.tx - tilt.x) * Math.min(1, dt * 4); tilt.y += (tilt.ty - tilt.y) * Math.min(1, dt * 4);
    $('orbit').style.transform = 'translate3d(' + (tilt.x * 8).toFixed(1) + 'px,' + (tilt.y * 6).toFixed(1) + 'px,0)';
    if (Math.abs(tilt.tx - tilt.x) < 0.004 && Math.abs(tilt.ty - tilt.y) < 0.004) { running = false; return; }
    requestAnimationFrame(tick);
  }

  fetch(BARE ? 'https://play.odaroo.co/games.json' : 'games.json', { cache: 'no-cache' }).then(function (r) { return r.json(); })
    .then(function (list) { build(Array.isArray(list) && list.length ? list : FALLBACK); })
    .catch(function () { build(FALLBACK); });

})();
</script>
